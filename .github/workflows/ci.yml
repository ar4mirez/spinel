name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push should not leave the old run burning CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The two tier-1 targets from README.md. A slice is not done until both are green.
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macos-arm64 }
          - { os: ubuntu-latest, name: linux-x64 }
    steps:
      # `spec/ruby` is the ruby/spec submodule; `cargo test` runs the harness
      # against it, so a shallow checkout without it fails.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build release
        run: cargo build --release --workspace

      # The issue's definition of done, asserted in CI and not just by a human.
      - name: spinel --version
        run: |
          ./target/release/spinel --version
          ./target/release/spinel --version | grep -Eq '^spinel [0-9]+\.[0-9]+\.[0-9]+ \(ruby [0-9]+\.[0-9]+\.[0-9]+\) \[.+\]$'

      - name: Test
        run: cargo test --workspace

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The collector in #7 is the only unsafe code in the tree, and its bugs are the kind
  # that a passing test cannot see: a stale free-list link, a cell read after it was
  # handed back, a block never given to the allocator. Miri sees all three.
  #
  # Not `-Zmiri-strict-provenance`, which PRD 0006 guessed at: that mode bans the
  # integer-to-pointer round trip, and a tagged `Value` *is* that round trip. The
  # default model tracks exposed provenance, which is the one `Value` is written in.
  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2
        with:
          key: miri

      # The heap's tests scale themselves down under `cfg(miri)`: what is being checked
      # here is the pointer arithmetic, not ten million iterations of it.
      - run: cargo miri test -p spinel-vm

  # Catches a dependency edge that architecture.md forbids, e.g. Prism escaping
  # spinel-parse, before it becomes load-bearing and expensive to unwind.
  layering:
    name: crate layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: layering
      # Direct dependencies only: spinel-cli depends on spinel-parse, so a
      # transitive edge to Prism is expected and fine. A direct one is the bug.
      - name: No Prism outside spinel-parse
        run: |
          owners=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(any(.dependencies[]?; .name == "ruby-prism")) | .name' \
            | grep -v '^spinel-parse$' || true)
          if [ -n "$owners" ]; then
            echo "::error::these crates depend on ruby-prism directly: $owners (see docs/architecture.md)"
            exit 1
          fi
          echo "Prism is contained in spinel-parse"

      # `OnceLock`/`OnceCell` and a `static` lock joined this list in #10, which
      # is what the symbol table is built from: the old pattern would not have
      # caught it. CLAUDE.md's own wording — "`OnceCell` holding a `Value`" —
      # was already broader than the grep enforcing it.
      - name: No process-global VM state
        run: |
          if grep -rnE '(static mut|lazy_static!|thread_local!|OnceLock|OnceCell|static [A-Z_]+ *: *(Mutex|RwLock|Atomic))' \
             crates/ spec/harness/ --include='*.rs' \
             | grep -v 'crates/spinel-vm/src/shared/'; then
            echo "::error::process-global mutable state outside spinel-vm/src/shared/ (see CLAUDE.md)"
            exit 1
          fi
          echo "clean"

  # `stdlib/` is a verbatim copy of ruby/ruby's `lib/` at a pinned tag, not a
  # fork. This job is what makes that claim checkable: it re-fetches the tag and
  # diffs. Any difference fails, which is stricter than the "unexplained drift"
  # the slice asked for and needs no allowlist to stay honest.
  stdlib:
    name: stdlib drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/vendor-stdlib.sh --check

  # `crates/spinel-vm/tests/ancestors.txt` is CRuby's answer to 30-odd `include`
  # and `prepend` orderings, and `spinel-vm` is checked against it by
  # `tests/ancestors.rs`. This job checks the other half: that the table still
  # says what Ruby says. Without it the table is one engineer's reading of
  # `class.c` frozen into a file that can never be wrong.
  ancestors:
    name: ancestors oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          # The language version this build implements, so `include` semantics
          # are the ones Spinel is targeting rather than an older release's.
          ruby-version: '4.0'
      - run: ruby scripts/ancestors-oracle.rb --check

  # And the same again for #12's. `rescue TypeError` picks a handler by walking a
  # superclass chain, so `crates/spinel-vm/src/exceptions.txt` has to be Ruby's
  # chain and not a reading of `error.c`: which classes exist, what each inherits
  # from, and which of them define an `initialize` of their own — the last is why
  # `SignalException.new` refuses rather than answering as if it had validated
  # the signal name it never looked at.
  exceptions:
    name: exceptions oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          # The language version this build implements.
          ruby-version: '4.0'
      - run: ruby scripts/exceptions-oracle.rb --check

  # The same arrangement for #10's answers. `crates/spinel-vm/tests/eval.txt` is
  # what CRuby prints for ~90 snippets of the Ruby this slice compiles, and
  # `tests/eval.rs` is what makes Spinel agree. This job checks the other half:
  # that the table still says what Ruby says. Floored division, the sign of `%`,
  # `0` being truthy and `&&` returning an operand are all places an interpreter
  # written from intuition is quietly wrong, so the expectations are measured
  # rather than believed.
  eval:
    name: eval oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          # The language version this build implements.
          ruby-version: '4.0'
      - run: ruby scripts/eval-oracle.rb --check

  # The anti-false-pass check, and the reason the pass count can be trusted at
  # all. Every example the harness reports `passed` is sliced back out of its
  # spec file and re-run on a real Ruby with a four-line mspec shim. A pass
  # Spinel had no right to is strictly worse than a blocked example, and it is
  # exactly the failure mode a partial VM invites: the harness only recognises
  # one matcher shape, so an example it *mis*-read would otherwise pass in
  # silence.
  passes:
    name: verify passes on real ruby
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: passes
      - run: cargo build --release -p spec-harness
      - run: ruby scripts/verify-passes.rb spec/ruby

  # The definition of done for the lowering (#3): every Ruby file in a real
  # corpus reaches `spinel_ast` without an unhandled node. The sweep exits
  # non-zero only on an unhandled node, never on a syntax error, because both
  # corpora ship files that are deliberately invalid Ruby.
  #
  # Both corpora are in the tree now: `stdlib/` since #4, `spec/ruby/` as a
  # submodule since #5. Nothing is cloned at a floating pin any more, so an
  # upstream commit cannot turn a green PR red.
  sweep:
    name: lower a real corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: sweep

      - run: cargo build --release -p spinel-cli

      - name: Sweep vendored corpora
        run: |
          for dir in spec/ruby stdlib; do
            echo "sweeping $dir"
            ./target/release/spinel parse "$dir"
          done

  # The definition of done for #5, and then for #10: the harness runs a
  # ruby/spec directory and reports, and since #10 some of what it reports is
  # `passed`. Two floors are asserted below and one ceiling: enough examples to
  # prove the corpus is checked out, enough passes to prove the VM still runs,
  # and zero failures — because a construct Spinel has not written yet must be
  # `blocked`, and the failure column has to stay meaningful for the day
  # something really does disagree with Ruby.
  spec:
    name: ruby/spec harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: spec

      - name: Run language/if_spec.rb
        run: ./scripts/spec.sh language/if_spec.rb

      # An example floor, not an exact count: upstream adds specs. Without it,
      # an empty or unfetched submodule would report "0 examples" and pass,
      # which is the one result a spec runner must never fake.
      - name: Run language/
        run: |
          ./scripts/spec.sh language | tee spec-report.txt
          examples=$(sed -nE 's/^[0-9]+ files? · ([0-9]+) examples ·.*/\1/p' spec-report.txt)
          echo "language/ reports $examples examples"
          if [ "${examples:-0}" -lt 2000 ]; then
            echo "::error::language/ reported $examples examples; ruby/spec has ~2700, so the corpus is not all there"
            exit 1
          fi

          # A ratchet, not an equality: later slices earn more, and an exact
          # number would have to be edited by everyone who improved things.
          passed=$(sed -nE 's/.* · ([0-9]+) passed ·.*/\1/p' spec-report.txt)
          echo "language/ reports $passed passed"
          if [ "${passed:-0}" -lt 155 ]; then
            echo "::error::language/ passed $passed, down from the 155 #10 earned"
            exit 1
          fi

          failed=$(sed -nE 's/.* · ([0-9]+) failed ·.*/\1/p' spec-report.txt)
          if [ "${failed:-0}" -ne 0 ]; then
            echo "::error::language/ has $failed failing example(s): a real disagreement with Ruby"
            exit 1
          fi
