[workspace]
resolver = "3"
members = [
  "crates/*",
  "gems/nio4r-spinel/ext/nio4r_spinel",
  "gems/pg-spinel/ext/pg_spinel",
  "gems/puma-spinel/ext/puma_spinel",
  "gems/sqlite3-spinel/ext/sqlite3_spinel",
]
# pg-spinel's extension links the system's libpq, so only `--workspace` and
# `--package pg-spinel` build it.
default-members = [
  "crates/*",
  "gems/nio4r-spinel/ext/nio4r_spinel",
  "gems/puma-spinel/ext/puma_spinel",
  "gems/sqlite3-spinel/ext/sqlite3_spinel",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ar4mirez/spinel"

[workspace.dependencies]
spinel-ast = { path = "crates/spinel-ast", version = "0.1.0" }
spinel-core = { path = "crates/spinel-core", version = "0.1.0" }
spinel-ext = { path = "crates/spinel-ext", version = "0.1.0" }
spinel-jit = { path = "crates/spinel-jit", version = "0.1.0" }
spinel-parse = { path = "crates/spinel-parse", version = "0.1.0" }
spinel-regex = { path = "crates/spinel-regex", version = "0.1.0" }
spinel-vm = { path = "crates/spinel-vm", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
# The JIT (phase 6, #120). 0.121 is the newest whose `rust-version` the
# workspace's allows.
cranelift-codegen = "0.121"
cranelift-frontend = "0.121"
cranelift-jit = "0.121"
cranelift-module = "0.121"
cranelift-native = "0.121"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# The no-globals rule from CLAUDE.md, enforced by the compiler rather than by review.
mut_from_ref = "deny"

# Cranelift's code generator unoptimised makes a debug build's JIT, and so
# `spinel-jit`'s tests, several times slower to compile each body.
[profile.dev.package.cranelift-codegen]
opt-level = 2

[profile.dev.package.regalloc2]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
