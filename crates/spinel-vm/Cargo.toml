[package]
name = "spinel-vm"
description = "Values, heap, GC, shapes, bytecode, interpreter, Ractors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
spinel-ast.workspace = true
spinel-regex.workspace = true

# Test-only, and not a layering violation: the tests read Ruby source, which
# needs the parser, and `spinel-parse` depends on `spinel-ast` rather than on
# this crate. Prism still lives in exactly one place.
[dev-dependencies]
spinel-parse.workspace = true
# Test-only, and a cycle only on paper: `spinel-core` depends on this crate, and
# Cargo allows a dev-dependency to close that loop because a dev-dependency is
# not part of the library's own build. Tests that need the *core library* — not
# just the VM — say so here rather than moving to a crate that has one.
spinel-core.workspace = true

[lints]
workspace = true

# `bench/` at the repo root, per CLAUDE.md, rather than the crate's own
# `benches/`: the benchmarks describe the engine, not this one crate, and the
# next one compares against system `ruby --yjit`. `harness = false` because the
# built-in one is nightly-only and a `main` is enough to print three numbers.
[[bench]]
name = "method_cache"
path = "../../bench/method_cache.rs"
harness = false
