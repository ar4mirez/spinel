# The native half of the pg-spinel gem: libpq's C API, one call per method,
# on `PG::Spinel`, which `lib/pg_ext.rb` builds the pg gem's C half on in
# Ruby (docs/package-manager.md, section 6).
#
# libpq is the system's, linked as the pg gem's own source build links it:
# `build.rs` asks `pg_config` (or `$PG_CONFIG`) where it is, or takes
# `$PQ_LIB_DIR`. What libpq added after PostgreSQL 10, the oldest release
# the pg gem supports, is looked up in the loaded library when it is first
# called, where the pg gem tests for it when it is compiled.
#
# A workspace member so that `cargo` fetches libc with everything else and
# `tests/pg.rs` can build the library `--offline`; `build.rb` builds it and
# puts it in the gem.
[package]
name = "pg-spinel"
description = "The native half of the pg-spinel gem: libpq through spinel-ext."
# The gem's version, 1.7.0.1, as SemVer: the upstream version and the
# revision as build metadata.
version = "1.7.0+1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"
links = "pq"

[lib]
name = "pg_spinel"
crate-type = ["cdylib"]

[dependencies]
spinel-ext.workspace = true
libc = "0.2.189"

[lints]
workspace = true
