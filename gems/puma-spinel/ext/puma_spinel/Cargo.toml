# The native half of the puma-spinel gem: Puma's HTTP request parser, its
# MiniSSL engine's OpenSSL calls and the one `prctl` it makes, as methods of
# `Puma::Spinel`, which `lib/puma/puma_http11.rb` builds the puma gem's C
# extension on in Ruby (docs/package-manager.md, section 6).
#
# It links the system's OpenSSL 3, as Spinel itself does for `openssl`, so
# it needs nothing a plain build lacks: it is a default workspace member,
# built by `cargo build` and `tests/puma.rs` `--offline`; `build.rb` builds
# it and puts it in the gem.
[package]
name = "puma-spinel"
description = "The native half of the puma-spinel gem: Puma's HTTP parser and MiniSSL through spinel-ext."
# The gem's version, 8.1.2.1, as SemVer: the upstream version and the
# revision as build metadata.
version = "8.1.2+1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "puma_spinel"
crate-type = ["cdylib"]

[dependencies]
spinel-ext.workspace = true
libc = "0.2.189"
openssl-sys = "0.9.118"

[lints]
workspace = true
